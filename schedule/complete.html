<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>You're All Set</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; min-height: 100vh; display: grid; place-items: center; background: #080c1a; color: #fff; }
    .card { width: min(680px, 92vw); background: #111827; border: 1px solid #1f2d45; border-radius: 14px; padding: 24px; }
    h1 { margin: 0 0 10px; font-size: 38px; color: #00ffb4; }
    p { color: #cbd5e1; line-height: 1.6; }
    .btn { display: inline-block; margin-top: 10px; text-decoration: none; background: #00ffb4; color: #000; font-weight: 700; padding: 12px 16px; border-radius: 8px; }
  </style>
</head>
<body>
  <section class="card">
    <h1>You're all set!</h1>
    <p>Your trial reservations are confirmed. We look forward to seeing your family in class.</p>
    <a class="btn" href="/">Return to Website</a>
  </section>
  <script>
    (function () {
      try {
        var qs = new URLSearchParams(window.location.search || '');
        var leadId = (qs.get('lead_id') || '').trim();
        if (!leadId) return;
        fetch('/api/trial-owner-summary', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ lead_id: leadId, trigger: 'schedule-complete-page' }),
        }).catch(function () {});
      } catch (e) {}
    })();
  </script>
</body>
</html>
